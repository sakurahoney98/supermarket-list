name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch naming convention
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Branch: $BRANCH_NAME"

          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|refactor|test|chore)/issue-[0-9]+$ ]]; then
            echo "❌ Nome de branch inválido."
            echo "Use o padrão: <tipo>/issue-<numero>"
            echo "Exemplo: feature/issue-7"
            exit 1
          fi

          echo "✅ Nome da branch válido."

  backend-tests:
    runs-on: ubuntu-latest
    needs: check-branch

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Dar permissão ao mvnw
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Executar testes backend
        working-directory: ./backend
        run: ./mvnw test -Dspring.profiles.active=test

  frontend-tests:
    runs-on: ubuntu-latest
    needs: check-branch

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Executar testes frontend
        working-directory: ./frontend
        run: npm run test -- --watch=false
