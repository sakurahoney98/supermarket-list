<header class="home-header">
    <h2 class="home-header__emoji">
        🛒
    </h2>
    <h2 class="home-header__title">
        Supermarket List
    </h2>
    <p class="home-header__subtitle">Sua lista de compras inteligente</p>

</header>
<main class="home-content">
    <article class="card">
        <div class="card__icon card__icon--circle card__icon--blue">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-tag w-5 h-5">
                <path
                    d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z">
                </path>
                <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle>
            </svg>

        </div>
        <div class="card__info">
            <h2 class="card__info__quantity">{{ categorias }}</h2>
            <p class="card__info__name">Categorias</p>

        </div>

    </article>
    <article class="card">
        <div class="card__icon card__icon--circle card__icon--green">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-package w-5 h-5">
                <path
                    d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z">
                </path>
                <path d="M12 22V12"></path>
                <path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"></path>
                <path d="m7.5 4.27 9 5.15"></path>
            </svg>

        </div>
        <div class="card__info">
            <h2 class="card__info__quantity">{{ itens }}</h2>
            <p class="card__info__name">Itens</p>

        </div>

    </article>
    <article class="card">
        <div class="card__icon card__icon--circle card__icon--orange">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-trending-up w-5 h-5">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                <polyline points="16 7 22 7 22 13"></polyline>
            </svg>

        </div>
        <div class="card__info">
            <h2 class="card__info__quantity">{{ itensZerados }}</h2>
            <p class="card__info__name">Itens zerados no estoque</p>

        </div>

    </article>


</main>
<section class="home-quick-options" aria-label="Ações rápidas">
    <a class="card card--inline" routerLink="/categoria">
        <span class="card__icon card__icon--emoji">
            🏷️
        </span>

        <span class="card__info__title">Gerenciar Categorias</span>


    </a>

    <a class="card card--inline" routerLink="/item">
        <span class="card__icon card__icon--emoji">
            📦
        </span>
        <span class="card__info__title">Gerenciar Itens</span>
    </a>

</section>
