
<div class="toast-success"
role="status"
aria-live="polite"
[class.show]="mostrarToast">
    <div class="toast-success__icon">
        <img [src]="iconeSucesso" aria-hidden="true" alt="" width="24px" height="24px">
    </div>
    <div class="toast-success__content">
        {{ mensagem }}

    </div>
</div>
