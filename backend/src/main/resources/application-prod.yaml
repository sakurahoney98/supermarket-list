spring:
  application:
    name: supermarketlist
  datasource:
    url: ${DB_URL} 
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

app.cors.origins: ${CORS_ORIGINS}
app.cors.mappings: /**
app.cors.methods: "*"
app.cors.headers: "*"